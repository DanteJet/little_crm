server {
    listen 80;
    listen [::]:80;

    server_name littlejohn.ru www.littlejohn.ru;
    return 301 https://littlejohn.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name littlejohn.ru www.littlejohn.ru;

    ssl_certificate /etc/letsencrypt/live/littlejohn.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/littlejohn.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Heavy immutable-ish images should not consume Node's single event loop.
    location /img/ {
        alias /opt/little_crm/img/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # CSS and JavaScript are also served directly by nginx. Their filenames are
    # not content-hashed yet, so keep a shorter cache lifetime than images.
    location /public/ {
        alias /opt/little_crm/public/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
